<!doctype html>
<html lang="vi">
<head>

<style>

html{font-size:17px;height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;padding-inline:20px;padding-block:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}

h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
code,.set,.tid{font-family:var(--mono)}
sub{font-size:.7em;line-height:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-block:14px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
.brand h1{font-size:1.65rem;line-height:1.1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.9rem;max-width:70ch}
.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.field select,.field input{background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:7px 10px;min-height:38px}
.field input[type=number]{width:96px;font-variant-numeric:tabular-nums}
.field .row{display:flex;gap:6px;align-items:center}
.field .unit{color:var(--muted);font-size:.9rem;white-space:nowrap}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer;min-height:38px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:24px;align-items:stretch;padding-top:16px;padding-bottom:14px;flex:1;min-height:0;overflow:hidden}
@media (max-width:900px){.wrap{grid-template-columns:1fr;overflow:visible}}
.db{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);height:100%;overflow-y:auto}
@media (max-width:900px){.db{position:static;max-height:none;height:auto}}
.db h2{font-size:1.2rem}
.db .iset{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.db .meta{color:var(--muted);font-size:.86rem;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.db table{width:100%;border-collapse:collapse;font-size:.95rem}
.db th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.db td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;transition:background .15s}
.db tr.hit td{background:var(--hit)}
.db tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--hit-line)}
.tid{color:var(--muted);font-size:.85rem;white-space:nowrap}
.tr-items{display:flex;flex-wrap:wrap;gap:4px}
.it{display:inline-block;font-family:var(--mono);font-size:.86rem;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);line-height:1.5}
.it.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line-strong);background:var(--surface-2)}
.legend .lk::before{background:var(--keep-bg);border-color:var(--keep)}
.legend .ld::before{background:var(--drop-bg);border-color:var(--drop)}
.legend .lp::before{background:var(--prune-bg);border-color:var(--prune)}
.legend .lD::before{background:var(--drop);border-color:var(--drop)}
.legend .la::before{background:var(--accent-bg);border-color:var(--accent)}
.legend .lx::before{background:var(--drop-bg);border-color:var(--drop-line);border-style:dashed}
.legend .lg::before{background:transparent;border-style:dashed}

.stage{min-width:0;display:flex;flex-direction:column;height:100%;min-height:0;overflow:hidden}
@media (max-width:900px){.stage{height:auto;overflow:visible}}
.rail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;flex-shrink:0}
.rail .grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-left:6px;padding-right:2px}
.rail .grp:first-child{margin-left:0}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.84rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.done{color:var(--ink);border-color:var(--line)}
.chip.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chip.end{border-style:dashed}

.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px 28px;box-shadow:var(--shadow);flex:1;min-height:0;overflow-y:auto}

.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:600;margin-bottom:6px}
.step h2{font-size:1.85rem;line-height:1.15;margin-bottom:10px}
.lead{font-size:1.06rem;max-width:68ch;margin:0 0 16px}
.formula{font-family:var(--mono);font-size:.95rem;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 18px;overflow-x:auto}
.formula b{color:var(--accent-ink);font-weight:600}
.tblwrap{overflow-x:auto;margin:0 0 18px}
table.t{width:100%;border-collapse:collapse;font-size:.97rem}
table.t th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line-strong);white-space:nowrap}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
table.t tr.keep td:first-child{box-shadow:inset 3px 0 0 var(--keep)}
table.t tr.drop td:first-child{box-shadow:inset 3px 0 0 var(--drop)}
table.t tr.prune td:first-child{box-shadow:inset 3px 0 0 var(--prune)}
table.t tr.skip td{color:var(--muted)}
table.t tr.hover{cursor:pointer}
table.t tr.hover:hover td,table.t tr.pinned td{background:var(--hit)}
.set{display:inline-block;font-family:var(--mono);font-size:.92em;padding:1px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;line-height:1.55}
.set.k{background:var(--keep-bg);border-color:var(--keep-line);color:var(--keep)}
.set.d{background:var(--drop-bg);border-color:var(--drop-line);color:var(--drop);text-decoration:line-through;text-decoration-thickness:1px}
.set.p{background:var(--prune-bg);border-color:var(--prune-line);color:var(--prune)}
.set.a{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}
.set.g{opacity:.45}
.set.hover{cursor:pointer}
.set.pinned{outline:2px solid var(--hit-line)}
.setlist{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
.tag.k{color:var(--keep);background:var(--keep-bg);border-color:var(--keep-line)}

.tag.p{color:var(--prune);background:var(--prune-bg);border-color:var(--prune-line)}
.chk{font-family:var(--mono);font-size:.9em;margin-right:10px;white-space:nowrap}
.chk.ok{color:var(--keep)}
.chk.no{color:var(--drop);font-weight:600}

.result.p{background:var(--prune-bg);border-color:var(--prune-line)}

.takeaway strong{font-family:var(--serif);font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.navbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap;flex-shrink:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;box-shadow:var(--shadow)}
@media (max-width:900px){.navbar{position:fixed;bottom:12px;left:16px;right:16px;z-index:40}}
.navbar .pos{color:var(--muted);font-variant-numeric:tabular-nums}
.navbar .keys{font-size:.8rem;color:var(--muted)}
kbd{font-family:var(--mono);font-size:.8em;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.stat .v{font-family:var(--serif);font-size:1.7rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:.78rem;color:var(--muted);margin-top:2px}
.rulecard{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.rulecard header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.rulecard header h3{font-size:1.05rem}
.rulecard .tblwrap{margin:0}
.rulecard table.t th{border-bottom-width:1px}
.arrow{font-family:var(--mono);color:var(--muted);padding:0 4px}
.mathbox{display:flex;flex-direction:column;gap:12px;background:var(--surface-2);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:14px 16px;margin:0 0 18px;overflow-x:auto}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.mlbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;min-width:96px}
.math{font-family:var(--serif);font-style:italic;font-size:1.15rem;display:inline-flex;align-items:center;flex-wrap:wrap;gap:6px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25;margin:0 3px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.frac>span:last-child{padding:0 4px}
table.t .frac{font-variant-numeric:tabular-nums}
.deriv{display:flex;flex-direction:column;gap:18px;margin-top:10px}
.deriv .ct{min-width:0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.deriv .ct.joins{flex-direction:column;align-items:flex-start;gap:6px;padding-left:12px;border-left:2px solid var(--line)}
.deriv .ct .small{flex-basis:100%}
.deriv .set.g{background:var(--surface-2);border-color:var(--line);color:var(--muted);opacity:1}
.jl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.op{font-family:var(--mono);color:var(--muted)}
.mth{font-family:var(--serif);font-weight:600;font-size:1.2rem}
.boxed{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;border:1.5px solid var(--ink);border-radius:6px;padding:8px 12px;font-family:var(--mono);font-size:1rem}

h3.sec{font-size:1.25rem;margin:22px 0 10px}
.latwrap{overflow-x:auto;margin:0 0 10px;padding-bottom:4px}
.latwrap svg{display:block;margin:0 auto;font-family:var(--mono);font-size:12px}
.latwrap text.lk{fill:var(--muted);font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em}
.ln{cursor:pointer}
.ln rect{fill:var(--surface-2);stroke:var(--line-strong);stroke-width:1.2;transition:stroke-width .1s}
.ln text{fill:var(--muted)}
.ln:hover rect,.ln.pinned rect{stroke:var(--hit-line);stroke-width:2.5}
.ln-k rect{fill:var(--keep-bg);stroke:var(--keep-line)} .ln-k text{fill:var(--keep);font-weight:600}
.ln-d rect{fill:var(--drop);stroke:var(--drop)} .ln-d text{fill:var(--on-accent);font-weight:600}
.ln-p rect{fill:var(--prune-bg);stroke:var(--prune)} .ln-p text{fill:var(--prune);font-weight:600}
.ln-x rect{fill:var(--drop-bg);stroke:var(--drop-line);stroke-dasharray:3 2} .ln-x text{fill:var(--drop);opacity:.8}
.ln-a rect{fill:var(--accent-bg);stroke:var(--accent)} .ln-a text{fill:var(--accent-ink);font-weight:600}
.ln-g rect{fill:none;stroke:var(--line);stroke-dasharray:3 2} .ln-g text{fill:var(--muted);opacity:.7}
.le{fill:none;stroke:var(--line);stroke-width:1.2;opacity:.6}
.le-k{stroke:var(--accent);opacity:.5}
.le-a{stroke:var(--accent);opacity:.5;stroke-dasharray:4 3}
.le-d{stroke:var(--drop);opacity:.6}
.le-p{stroke:var(--prune);opacity:.6}
.le-x{stroke:var(--drop-line);opacity:.55}
.latcap{max-width:78ch;margin:0 0 10px}
.latopt{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 10px}
.latopt label{cursor:pointer}
.abbr{font-size:.8rem;color:var(--muted);margin:2px 0 8px}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
.err{background:var(--drop-bg);border:1px solid var(--drop-line);color:var(--drop);padding:10px 14px;border-radius:8px;margin-bottom:12px}
</style>

<body>
<header class="app-header">
  <div class="app-header-inner">
    <a class="app-brand" href="/shop"><span class="app-logo" aria-hidden="true">🛒</span>BasketIQ</a>
    <nav class="app-nav" id="appNav" aria-label="Điều hướng chính">
      <a href="/shop">Cửa hàng</a>
      <a href="/" class="active" aria-current="page">Demo thuật toán</a>
      <a href="/stats">Thống kê Apriori</a>
      <a href="/admin">Admin</a>
    </nav>
    <button class="app-menu-toggle" type="button" aria-label="Mở menu" aria-controls="appNav" onclick="document.getElementById('appNav').classList.toggle('open')">☰</button>
  </div>
</header>

<header class="top">
  <div class="brand">
    <h1>Apriori từng bước</h1>
    <p>Khai phá tập phổ biến bằng sinh ứng viên có ràng buộc: C<sub>k</sub> = join → prune → quét D → L<sub>k</sub>, rồi sinh luật kết hợp.</p>
  </div>
  <div class="controls">
    <div class="field"><label for="preset">Bộ dữ liệu</label><select id="preset"></select></div>
    <div class="field"><label for="minsup">min_sup</label><div class="row"><input id="minsup" type="number" min="0" max="100" step="5" value="30"><span class="unit" id="supunit">%</span></div></div>
    <div class="field"><label for="minconf">min_conf</label><div class="row"><input id="minconf" type="number" min="0" max="100" step="5" value="70"><span class="unit">%</span></div></div>
    <button class="btn" id="run">Chạy lại</button>
  </div>
</header>

<main class="wrap">
  <aside class="db" aria-label="Cơ sở dữ liệu giao dịch">
    <div class="iset">
      <h2>Tập item I</h2>
      <div class="meta">đã sắp theo thứ tự từ điển</div>
      <div class="setlist" id="itemlist"></div>
    </div>
    <h2>CSDL giao dịch D</h2>
    <div class="meta" id="dbmeta"></div>
    <div id="dbtable"></div>
    <div style="display:none" aria-hidden="true">
      <select id="supmode"><option value="pct" selected>%</option><option value="count">count</option></select>
      <textarea id="baskets"></textarea>
      <button id="apply" type="button"></button>
      <div id="srcnote"></div>
    </div>
  </aside>

  <section class="stage">
    <nav class="rail" id="rail" aria-label="Các bước"></nav>
    <article class="step fade" id="step"></article>
    <footer class="navbar">
      <button class="btn ghost" id="prev">← Bước trước</button>
      <span class="pos" id="pos"></span>
      <span class="keys">Phím <kbd>←</kbd> <kbd>→</kbd> hoặc <kbd>Space</kbd> để chuyển bước</span>
      <button class="btn" id="next">Bước tiếp →</button>
    </footer>
  </section>
</main>

<script>
let PRESETS = [];

const cmpItem = (a,b) => a.localeCompare(b, undefined, {numeric:true, sensitivity:'base'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key = arr => arr.join('|');
const pct = x => (x*100).toFixed((x*100) % 1 === 0 ? 0 : 1) + '%';
const sub = (base,k) => `${base}<sub>${k}</sub>`;

function parseBaskets(text){
  const out = [];
  let auto = 1;
  for (const raw of text.split(/\r?\n/)){
    let line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    let tid = null;
    const m = line.match(/^([^:,;|\t]+):\s*(.*)$/);
    if (m){ tid = m[1].trim(); line = m[2]; }
    const items = [...new Set(line.split(/[,;|\t]+/).map(s=>s.trim()).filter(Boolean))].sort(cmpItem);
    if (!items.length) continue;
    out.push({ tid: tid || ('T' + auto), items });
    auto++;
  }
  return out;
}

function combos(arr, k, start=0, cur=[], out=[]){
  if (cur.length === k){ out.push(cur.slice()); return out; }
  for (let i=start;i<arr.length;i++){ cur.push(arr[i]); combos(arr,k,i+1,cur,out); cur.pop(); }
  return out;
}

function makeCmpSet(items){
  const rank = new Map(items.map((it,i)=>[it,i]));
  return (a,b) => { for (let i=0;i<Math.min(a.length,b.length);i++){ const d = rank.get(a[i]) - rank.get(b[i]); if (d) return d; } return a.length-b.length; };
}

async function runApriori(D, minSup, minConf){
  const N = D.length;
  const minCount = Math.max(1, Math.ceil(minSup * N - 1e-9));
  const res = await fetch('/api/apriori', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ transactions: D, min_count: minCount, min_confidence: minConf }),
  });
  const payload = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(payload.error || `Lỗi máy chủ (${res.status})`);
  payload.count = new Map(Object.entries(payload.count));
  payload.pruned = new Set(payload.pruned);
  payload.cmpSet = makeCmpSet(payload.items);
  payload.minSup = minSup;
  return payload;
}

const state = { D: [], R: null, i: 0, hl: null, pin: null, latFull: false };
const $ = id => document.getElementById(id);

function initPresets(){
  $('preset').innerHTML = PRESETS.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  $('preset').addEventListener('change', ()=> loadPreset($('preset').value));
  $('minsup').addEventListener('change', run);
  $('minconf').addEventListener('change', run);
  $('run').addEventListener('click', run);
  $('prev').addEventListener('click', ()=>go(state.i-1));
  $('next').addEventListener('click', ()=>go(state.i+1));
  document.addEventListener('keydown', e=>{
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); go(state.i+1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); go(state.i-1); }
    if (e.key === 'Home'){ e.preventDefault(); go(0); }
    if (e.key === 'End'){ e.preventDefault(); go(1e9); }
  });
}

function loadPreset(id){
  const p = PRESETS.find(x=>x.id===id) || PRESETS[0];
  $('preset').value = p.id;
  $('baskets').value = p.text;
  state.D = parseBaskets(p.text);
  const N = state.D.length || 1;
  const supPct = p.mode === 'count' ? Math.round((p.minsup / N) * 100) : p.minsup;
  $('minsup').value = supPct;
  $('minconf').value = p.minconf;
  return run();
}

async function run(){
  state.D = parseBaskets($('baskets').value);
  const N = state.D.length;
  const minSup = (parseFloat($('minsup').value) || 0) / 100;
  const minConf = (parseFloat($('minconf').value) || 0) / 100;
  state.hl = null; state.pin = null;
  if (!N){
    state.R = null;
    $('step').innerHTML = '<div class="err">Chưa có giao dịch nào.</div>';
    $('rail').innerHTML = ''; $('pos').textContent = ''; renderDB(); return;
  }
  try {
    state.R = await runApriori(state.D, minSup, minConf);
  } catch (err){
    state.R = null;
    $('step').innerHTML = `<div class="err">Không thể phân tích: ${esc(err.message)}</div>`;
    renderDB();
    return;
  }
  go(0);
}

function setHL(items){ state.hl = items; renderDB(); }

function renderDB(){
  const R = state.R, N = state.D.length;
  const hl = state.pin || state.hl;
  const hs = hl ? new Set(hl) : null;
  $('dbmeta').innerHTML = R ? `N = ${N} giao dịch · m = ${R.items.length} item · min_sup = ${pct(R.minSup)} · min_conf = ${pct(R.minConf)}` : `N = ${N}`;
  $('dbtable').innerHTML = `<table><thead><tr><th>TID</th><th>Items</th></tr></thead><tbody>` + state.D.map(t=>{
    const hit = hs && hl.every(x=>t.items.includes(x));
    return `<tr class="${hit?'hit':''}"><td class="tid">${esc(t.tid)}</td><td><div class="tr-items">${t.items.map(i=>`<span class="it ${hs&&hs.has(i)?'on':''}">${esc(i)}</span>`).join('')}</div></td></tr>`;
  }).join('') + `</tbody></table>`;
}

function go(i){
  const R = state.R; if (!R) return;
  state.i = Math.max(0, Math.min(R.steps.length-1, i));
  state.pin = null; state.hl = null;
  renderRail(); renderItems(); renderStep(); renderDB();
  $('prev').disabled = state.i === 0;
  $('next').disabled = state.i === R.steps.length-1;
  $('pos').textContent = `Bước ${state.i+1} / ${R.steps.length}`;
  const el = $('step'); el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade');
  if (window.innerWidth < 900) el.scrollIntoView({ behavior:'smooth', block:'start' });
}

function renderItems(){
  const el = $('itemlist');
  if (!el || !state.R) return;
  el.innerHTML = state.R.items.map(i=>`<span class="set a" ${dataset([i])}>${esc(i)}</span>`).join('');
  bindHover(el);
}

function chipLabel(s){
  switch (s.type){
    case 'setup': return 'Bài toán';
    case 'join': return `Join → ${sub('C',s.k)}`;
    case 'prune': return `Prune ${sub('C',s.k)}`;
    case 'scan': return s.k===1 ? `Quét D: ${sub('C',1)} → ${sub('L',1)}` : `Quét D → ${sub('L',s.k)}`;
    case 'end': return 'Dừng';
    case 'rules': return 'Sinh luật';
    case 'summary': return 'Tổng kết';
  }
  return '';
}

function renderRail(){
  const R = state.R;
  let html = '', lastK = null;
  R.steps.forEach((s,idx)=>{
    const k = s.k;
    if (k && k !== lastK && (s.type==='join' || s.type==='scan')){ html += `<span class="grp">k = ${k}</span>`; lastK = k; }
    if (s.type==='rules') html += `<span class="grp">Pha 2</span>`;
    const cls = idx===state.i ? 'cur' : (idx<state.i ? 'done' : '');
    html += `<button class="chip ${cls} ${s.type==='end'?'end':''}" data-i="${idx}">${chipLabel(s)}</button>`;
  });
  $('rail').innerHTML = html;
  $('rail').querySelectorAll('.chip').forEach(b=>b.addEventListener('click', ()=>go(+b.dataset.i)));
}

const setHTML = (arr, cls='') => `<span class="set ${cls}">{${arr.map(esc).join(', ')}}</span>`;
const setList = (arr, cls='') => arr.length ? arr.map(s=>setHTML(s,cls)).join(' ') : '<span class="muted">∅</span>';
const dataset = arr => `data-hl="${esc(arr.join('|'))}"`;

function bindHover(root){
  if (!root || !root.querySelectorAll) return;
  root.querySelectorAll('[data-hl]').forEach(el=>{
    const items = el.dataset.hl.split('|');
    el.classList.add('hover');
    el.addEventListener('mouseenter', ()=>{ if (!state.pin) setHL(items); });
    el.addEventListener('mouseleave', ()=>{ if (!state.pin) setHL(null); });
    el.addEventListener('click', ()=>{
      const same = state.pin && key(state.pin) === key(items);
      if (document.querySelectorAll) document.querySelectorAll('.pinned').forEach(x=>x.classList.remove('pinned'));
      state.pin = same ? null : items;
      if (!same) el.classList.add('pinned');
      setHL(same ? null : items);
    });
  });
}

function abbrevMap(items){
  const low = items.map(s=>s.toLowerCase());
  const map = new Map();
  items.forEach((it,i)=>{
    let ab = it;
    for (let L=1; L<it.length; L++){
      const p = low[i].slice(0,L);
      if (!low.some((o,j)=>j!==i && o.startsWith(p))){ ab = it.slice(0,L); break; }
    }
    map.set(it, ab);
  });
  return map;
}

function latticeState(R, upto){
  const st = new Map();
  for (let i=0;i<=upto;i++){
    const s = R.steps[i];
    if (s.type==='join'){ for (const c of s.cands) st.set(key(c),'a'); }
    else if (s.type==='prune'){ for (const r of s.rows) if (!r.keep) st.set(key(r.c),'p'); }
    else if (s.type==='scan'){ for (const r of s.rows) st.set(key(r.c), r.keep?'k':'d'); }
  }
  return st;
}

function latticeModel(R, upto){
  const m = R.items.length;
  const st = latticeState(R, upto);
  const status = new Map();
  const rows = [];
  const exact = m <= 12;
  if (exact){
    for (let k=1;k<=m;k++){
      const all = combos(R.items,k).sort(R.cmpSet);
      for (const c of all){
        const kk = key(c);
        let cls = st.get(kk);
        if (!cls){
          cls = 'g';
          for (let i=0;i<c.length;i++){
            const s = status.get(key(c.filter((_,j)=>j!==i)));
            if (s==='d'||s==='p'||s==='x'){ cls='x'; break; }
          }
        }
        status.set(kk, cls);
      }
      rows.push(all);
    }
  } else {
    for (const [kk,cls] of st){ const c = kk.split('|'); if (!rows[c.length-1]) rows[c.length-1] = []; rows[c.length-1].push(c); status.set(kk,cls); }
    for (let k=0;k<rows.length;k++) rows[k] = (rows[k]||[]).sort(R.cmpSet);
  }
  const stats = { k:0, d:0, p:0, x:0, g:0, a:0 };
  for (const v of status.values()) stats[v]++;
  return { rows, status, stats, exact };
}

const LAT_TITLE = { k:'frequent (đã đếm)', d:'đã đếm, không frequent', p:'sinh ở join, bị prune (không đếm)', x:'bị cắt tỉa ngầm: chứa tập con không frequent, không cần sinh hay đếm', a:'ứng viên đang chờ đếm', g:'chưa xét' };

function latticeSVG(R, model, full){
  const CW=7.2, PX=8, H=26, GX=8, RH=88, PAD=14, ML=54;
  const shown = model.rows.map((row,i)=>({ k:i+1, nodes: full ? row : row.filter(c=>'akdp'.includes(model.status.get(key(c)))) })).filter(r=>r.nodes.length);
  if (!shown.length) return '<p class="muted small">Chưa có itemset nào được sinh.</p>';
  let ab = null;
  const label = c => '{' + c.map(x=>ab ? ab.get(x) : x).join(',') + '}';
  const wOf = c => Math.max(30, label(c).length*CW + 2*PX);
  const rowW = nodes => nodes.reduce((a,c)=>a + wOf(c), 0) + GX*(nodes.length-1);
  let W = Math.max(...shown.map(r=>rowW(r.nodes)));
  if (W > 1100){ ab = abbrevMap(R.items); W = Math.max(...shown.map(r=>rowW(r.nodes))); }
  const pos = new Map();
  let y = PAD;
  for (const r of shown){
    let x = ML + (W - rowW(r.nodes))/2;
    for (const c of r.nodes){ const w = wOf(c); pos.set(key(c), { x, y, w, cx: x + w/2 }); x += w + GX; }
    r.y = y; y += RH;
  }
  const totalW = Math.round(ML + W + PAD), totalH = Math.round(y - RH + H + PAD);
  let back = '', front = '', nodes = '';
  for (const r of shown){
    nodes += `<text class="lk" x="${PAD}" y="${r.y+H/2}" dy=".35em">k = ${r.k}</text>`;
    for (const c of r.nodes){
      const kk = key(c), p = pos.get(kk), cls = model.status.get(kk);
      if (r.k > 1) for (let i=0;i<c.length;i++){
        const q = pos.get(key(c.filter((_,j)=>j!==i)));
        if (!q) continue;
        const line = `<line class="le le-${cls}" x1="${q.cx.toFixed(1)}" y1="${q.y+H}" x2="${p.cx.toFixed(1)}" y2="${p.y}"/>`;
        if (cls==='k' || cls==='a' || cls==='d') front += line; else back += line;
      }
      const n = R.count.get(kk);
      const title = LAT_TITLE[cls] + (n !== undefined ? ` · support = ${pct(n/R.N)}` : '');
      nodes += `<g class="ln ln-${cls}" ${dataset(c)} transform="translate(${p.x.toFixed(1)},${p.y})"><title>${esc(title)}</title><rect width="${p.w.toFixed(1)}" height="${H}" rx="6"/><text x="${(p.w/2).toFixed(1)}" y="${H/2}" dy=".35em" text-anchor="middle">${esc(label(c))}</text></g>`;
    }
  }
  const fit = totalW > 1100 ? ' style="width:100%;height:auto"' : '';
  let h = `<div class="latwrap"><svg width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}"${fit} role="img" aria-label="Lattice itemset">${back}${front}${nodes}</svg></div>`;
  if (ab) h += `<div class="abbr">Viết tắt: ${R.items.map(i=>`<b>${esc(ab.get(i))}</b> = ${esc(i)}`).join(' · ')}</div>`;
  return h;
}

function latticeBox(R, upto){
  const m = R.items.length, total = Math.pow(2,m)-1;
  const full = m <= 6 || (m <= 9 && state.latFull);
  const model = latticeModel(R, upto);
  const st = model.stats;
  const cap = `Kết quả cuối: ${st.k} frequent (xanh lá), ${st.d} đã đếm nhưng không frequent (đỏ đậm), ${st.p} bị prune (vàng)${model.exact ? `, ${st.x} bị cắt tỉa ngầm (đỏ nhạt)` : ''}. Apriori chỉ đếm ${st.k + st.d}/${total.toLocaleString('vi-VN')} itemset.`;
  let h = `<h3 class="sec">Lattice itemset sau bước này</h3><p class="latcap">${cap}</p>`;
  if (m > 6){
    h += `<div class="latopt small muted"><span>Lattice đầy đủ có ${total.toLocaleString('vi-VN')} nút${m <= 9 ? '; mặc định chỉ vẽ các itemset Apriori đã sinh.' : ', quá lớn để vẽ; chỉ vẽ các itemset Apriori đã sinh.'}</span>${m <= 9 ? `<label><input type="checkbox" id="latfull" ${state.latFull?'checked':''}> Vẽ đủ lattice (thu nhỏ cho vừa khung, rê chuột để xem từng nút)</label>` : ''}</div>`;
  }
  h += latticeSVG(R, model, full);
  h += `<div class="legend"><span class="lk">frequent (đã đếm)</span><span class="lD">không frequent (đã đếm)</span><span class="la">ứng viên chờ đếm</span><span class="lp">sinh ở join, bị prune</span>${full ? `<span class="lx">bị cắt tỉa ngầm — không cần đếm</span><span class="lg">chưa xét</span>` : ''}</div>`;
  return h;
}

function renderStep(){
  const R = state.R, s = R.steps[state.i], N = R.N;
  let h = '';

  if (s.type === 'setup'){
    h += `<div class="eyebrow">Đặt vấn đề</div><h2>Dữ liệu và ngưỡng khai phá</h2>
      <p class="lead">Pha 1: tìm những sản phẩm thường được mua cùng nhau, tức mọi itemset X có support(X) ≥ min_sup.<br>Pha 2: từ các tập đó sinh luật A ⇒ B có confidence ≥ min_conf.</p>`;
  }

  else if (s.type === 'scan'){
    const k = s.k;
    h += `<div class="eyebrow">k = ${k} · Quét D lần ${s.scanNo} · Đếm support</div>
      <h2>Quét D: ${sub('C',k)} → ${sub('L',k)}</h2>
      <p class="lead">${k === 1 ? `${sub('C',1)} gồm mọi 1-itemset. ` : ''}Tính support(c) cho từng ứng viên, giữ lại c có support(c) ≥ ${pct(R.minSup)}.</p>
      <div class="result a"><span class="lbl">${sub('C',k)} =</span> ${setList(s.rows.map(r=>r.c),'a')} <span class="muted small">(${s.rows.length} ứng viên)</span></div>
      <div class="tblwrap"><table class="t"><thead><tr><th>Ứng viên c</th><th>Giao dịch chứa c</th><th>support</th><th>Kết luận</th></tr></thead><tbody>`;
    for (const r of s.rows){
      h += `<tr class="${r.keep?'keep':'drop'}" ${dataset(r.c)}><td>${setHTML(r.c, r.keep?'k':'d')}</td><td class="small">${r.tids.length ? r.tids.map(esc).join(', ') : '<span class="muted">—</span>'}</td><td>${r.n}/${N} = ${pct(r.sup)}</td><td>${r.keep ? `<span class="tag k">∈ ${sub('L',k)}</span>` : `<span class="tag d">loại · ${pct(r.sup)} &lt; ${pct(R.minSup)}</span>`}</td></tr>`;
    }
    h += `</tbody></table></div>
      <div class="result k"><span class="lbl">${sub('L',k)} =</span> ${setList(s.L,'k')} <span class="muted small">(${s.L.length}/${s.rows.length} ứng viên frequent)</span></div>`;
  }

  else if (s.type === 'join'){
    const k = s.k, prev = s.prevL;
    const joins = s.pairs.filter(p=>p.ok);
    const plus = (a,b,c) => `<div class="jl">${setHTML(a,'k')} <span class="op">+</span> ${setHTML(b,'k')} <span class="op">→</span> ${setHTML(c,'a')}</div>`;
    h += `<div class="eyebrow">k = ${k} · apriori_gen · Bước 1: Join</div>
      <h2>Từ ${sub('L',k-1)} → ${sub('C',k)}: JOIN</h2>
      <div class="deriv">
        <div class="ct"><span class="mth">${sub('L',k-1)} =</span> ${setList(prev,'k')}</div>
        <div class="ct"><span class="mth">${sub('C',k)} = ${sub('L',k-1)} ⋈ ${sub('L',k-1)}</span><span class="small muted">Quy tắc join: ghép hai itemset có <b>k − 2 = ${k-2}</b> phần tử đầu giống nhau, chỉ khác phần tử cuối${k===2 ? ' → mọi cặp đều ghép được' : ''}.</span></div>`;
    if (!s.pairs.length){
      h += `<div class="ct muted">${sub('L',k-1)} chỉ có ${prev.length} itemset nên không có cặp nào để ghép.</div>
        <div class="ct"><span class="boxed">${sub('C',k)} = ∅</span></div>`;
    } else {
      h += `<div class="ct joins">${joins.map(p=>plus(p.l1,p.l2,p.cand)).join('')}</div>
        <div class="ct"><span class="boxed"><span class="mth">${sub('C',k)} =</span> ${setList(s.cands,'a')}</span> <span class="muted small">${s.cands.length} ứng viên${k===2 ? ` = C(${prev.length}, 2)` : ''}</span></div>`;
    }
    h += `</div>`;
  }

  else if (s.type === 'prune'){
    const k = s.k;
    h += `<div class="eyebrow">k = ${k} · apriori_gen · Bước 2: Prune (has_infrequent_subset)</div>
      <h2>Cắt tỉa ${sub('C',k)} bằng nguyên lý Apriori</h2>
      <p class="lead">Loại ngay ứng viên c có một tập con ${k-1} phần tử không thuộc ${sub('L',k-1)}, không cần quét D.</p>
      <div class="deriv" style="margin-bottom:18px">
        <div class="ct"><span class="mth">${sub('L',k-1)} =</span> ${setList(R.Lall[k-2],'k')}</div>
        <div class="ct"><span class="mth">${sub('C',k)} =</span> ${setList(s.rows.map(r=>r.c),'a')}</div>
      </div>
      <div class="tblwrap"><table class="t"><thead><tr><th>Ứng viên c</th><th>Các tập con ${k-1} phần tử · có ∈ ${sub('L',k-1)}?</th><th>Kết luận</th></tr></thead><tbody>`;
    for (const r of s.rows){
      h += `<tr class="${r.keep?'keep':'prune'}"><td>${setHTML(r.c, r.keep?'a':'p')}</td><td>${r.subs.map(x=>`<span class="chk ${x.ok?'ok':'no'}">${x.ok?'✓':'✗'} {${x.s.map(esc).join(', ')}}</span>`).join('')}</td><td>${r.keep ? `<span class="tag k">GIỮ</span>` : `<span class="tag p">LOẠI · ${r.subs.filter(x=>!x.ok).map(x=>`{${x.s.map(esc).join(', ')}}`).join(', ')} ∉ ${sub('L',k-1)}</span>`}</td></tr>`;
    }
    h += `</tbody></table></div>
      <div class="result a"><span class="lbl">${sub('C',k)} sau prune =</span> ${setList(s.kept,'a')} <span class="muted small">(${s.rows.length} → ${s.kept.length} ứng viên, prune ${s.prunedN})</span></div>`;
  }

  else if (s.type === 'end'){
    const k = s.k;
    const kmax = R.Lall.filter(l=>l.length).length;
    h += `<div class="eyebrow">Điều kiện dừng</div>
      <h2>${s.reason==='L' ? `${sub('L',k)} = ∅` : `${sub('C',k)} = ∅`} → kết thúc pha 1</h2>
      <p class="lead">${s.reason==='L' ? `Không ứng viên nào trong ${sub('C',k)} đạt min_sup.` : s.reason==='prune' ? `Mọi ứng viên trong ${sub('C',k)} đều bị prune.` : `Không sinh được ứng viên nào từ ${sub('L',k-1)}.`} Dừng với k<sub>max</sub> = ${kmax}, ${R.scans} lần quét D.</p>
      <div class="formula">L = ${R.Lall.filter(l=>l.length).map((_,i)=>sub('L',i+1)).join(' ∪ ') || '∅'} &nbsp;→&nbsp; <b>${R.freq.length}</b> frequent itemset</div>`;
    R.Lall.forEach((L,i)=>{ if (L.length) h += `<div class="result k"><span class="lbl">${sub('L',i+1)} =</span> ${setList(L,'k')}</div>`; });
  }

  else if (s.type === 'rules'){
    h += `<div class="eyebrow">Pha 2 · Sinh luật kết hợp</div>
      <h2>Từ frequent itemset l sinh luật s ⇒ (l − s)</h2>
      <div class="deriv" style="margin-bottom:18px">${R.Lall.filter(L=>L.length).map((L,i)=>`<div class="ct"><span class="mth">${sub('L',i+1)} =</span> ${setList(L, i===0 ? 'g' : 'k')}${i===0 ? '<span class="small muted">chỉ 1 item, không sinh được luật</span>' : ''}</div>`).join('')}</div>
      <p class="lead">Với mỗi frequent itemset l (|l| ≥ 2), tách l thành A ⊂ l và B = l − A. Luật A ⇒ B <b>mạnh</b> nếu confidence ≥ ${pct(R.minConf)}.</p>
      <div class="mathbox">
        <div class="mrow"><span class="mlbl">Confidence:</span><span class="math">confidence(A ⇒ B) = <span class="frac"><span>support(A ∪ B)</span><span>support(A)</span></span></span></div>
        <div class="mrow"><span class="mlbl">Lift:</span><span class="math">lift(A ⇒ B) = <span class="frac"><span>confidence(A ⇒ B)</span><span>support(B)</span></span></span></div>
        <div class="mrow"><span class="mlbl">Support:</span><span class="math">support(A ⇒ B) = support(A ∪ B) <span class="small muted">— luôn ≥ min_sup vì l frequent</span></span></div>
      </div>`;
    if (!s.groups.length) h += `<p class="lead muted">Không có frequent itemset nào có từ 2 item trở lên, nên không sinh được luật. Hãy giảm min_sup để thử.</p>`;
    for (const g of s.groups){
      h += `<div class="rulecard"><header><h3>l = ${setHTML(g.l,'k')}</h3><span class="muted small">support = ${g.sl}/${N} = ${pct(g.sl/N)} · ${g.rules.length} luật khả dĩ</span></header>
        <div class="tblwrap"><table class="t"><thead><tr><th>Luật A ⇒ B</th><th>confidence = support(A ∪ B) / support(A)</th><th>lift = confidence / support(B)</th><th>Mạnh?</th></tr></thead><tbody>`;
      for (const r of g.rules){
        h += `<tr class="${r.ok?'keep':'drop'}" ${dataset(g.l)}><td>${setHTML(r.s)}<span class="arrow">⇒</span>${setHTML(r.b)}</td><td><span class="frac"><span>${pct(r.sl/N)}</span><span>${pct(r.ss/N)}</span></span> = <b>${pct(r.conf)}</b></td><td><span class="frac"><span>${pct(r.conf)}</span><span>${pct(r.sb/N)}</span></span> = ${r.lift.toFixed(2)}</td><td>${r.ok ? `<span class="tag k">✓ xuất</span>` : `<span class="tag d">✗ &lt; ${pct(R.minConf)}</span>`}</td></tr>`;
      }
      h += `</tbody></table></div></div>`;
    }
    h += `<div class="result k"><span class="lbl">Luật mạnh:</span> <b>${s.strong}</b> <span class="muted small">trên ${s.groups.reduce((a,g)=>a+g.rules.length,0)} luật khả dĩ</span></div>
      <div class="takeaway">lift &gt; 1: tương quan dương; lift ≈ 1: gần như độc lập dù confidence cao (bẫy confidence).</div>`;
  }

  else if (s.type === 'summary'){
    const m = R.items.length, total = Math.pow(2,m)-1;
    const counted = R.count.size;
    const prunedN = R.pruned.size;
    h += `<div class="eyebrow">Tổng kết</div><h2>Apriori đã làm gì với bộ dữ liệu này</h2>
      <div class="stats">
        <div class="stat"><div class="v">${counted} / ${total.toLocaleString('vi-VN')}</div><div class="l">itemset phải đếm so với vét cạn</div></div>
        <div class="stat"><div class="v">${R.scans}</div><div class="l">lần quét D</div></div>
        <div class="stat"><div class="v">${prunedN}</div><div class="l">ứng viên bị prune (không cần đếm)</div></div>
        <div class="stat"><div class="v">${R.freq.length}</div><div class="l">frequent itemset</div></div>
        <div class="stat"><div class="v">${R.strong}</div><div class="l">luật mạnh (min_conf ${pct(R.minConf)})</div></div>
      </div>
      <h3 class="sec">Theo từng mức k</h3>
      <div class="tblwrap"><table class="t"><thead><tr><th>k</th><th>|C<sub>k</sub>| sau join</th><th>|C<sub>k</sub>| sau prune</th><th>% bị prune</th><th>|L<sub>k</sub>|</th><th>L<sub>k</sub></th></tr></thead><tbody>`;
    for (const l of R.levels){
      const pr = l.joinCount ? (l.joinCount - l.pruneCount)/l.joinCount : 0;
      h += `<tr><td>${l.k}</td><td>${l.joinCount}</td><td>${l.pruneCount ?? 0}</td><td>${l.k===1 ? '—' : pct(pr)}</td><td>${l.L.length}</td><td><div class="setlist">${l.L.length ? l.L.map(x=>`<span class="set k" ${dataset(x)}>{${x.map(esc).join(', ')}} <span class="muted">${pct(R.count.get(key(x))/R.N)}</span></span>`).join('') : '<span class="muted">∅</span>'}</div></td></tr>`;
    }
    h += `</tbody></table></div>`;
    const strongRules = R.groups.flatMap(g=>g.rules.filter(r=>r.ok).map(r=>({...r, l:g.l})));
    h += `<h3 class="sec">Luật mạnh (${strongRules.length})</h3>`;
    if (strongRules.length){
      h += `<div class="tblwrap"><table class="t"><thead><tr><th>Luật</th><th>support</th><th>confidence</th><th>lift</th></tr></thead><tbody>` + strongRules.map(r=>`<tr class="keep" ${dataset(r.l)}><td>${setHTML(r.s)}<span class="arrow">⇒</span>${setHTML(r.b)}</td><td>${pct(r.sl/N)}</td><td>${pct(r.conf)}</td><td>${r.lift.toFixed(2)}</td></tr>`).join('') + `</tbody></table></div>`;
    } else h += `<p class="muted">Không có luật nào đạt min_conf.</p>`;
    h += `<div class="takeaway">Chỉ đếm ${counted}/${total.toLocaleString('vi-VN')} itemset với ${R.scans} lần quét D, không bỏ sót frequent itemset nào.</div>`;
  }

  if (s.type === 'summary') h += latticeBox(R, state.i);

  const el = $('step');
  el.innerHTML = h;
  bindHover(el);
  if (el.querySelector){
    const cb = el.querySelector('#latfull');
    if (cb) cb.addEventListener('change', ()=>{ state.latFull = cb.checked; renderStep(); bindPinRestore(); });
  }
}

function bindPinRestore(){
  if (!state.pin || !$('step').querySelector) return;
  const el = $('step').querySelector(`[data-hl="${CSS.escape(state.pin.join('|'))}"]`);
  if (el) el.classList.add('pinned');
}

async function init(){
  try {
    const response = await fetch('/api/presets');
    if (!response.ok) throw new Error(`Lỗi máy chủ (${response.status})`);
    PRESETS = (await response.json()).ui_presets;
    initPresets();
    await loadPreset('grocery');
  } catch (err){
    $('step').innerHTML = `<div class="err">Không thể tải dữ liệu mẫu: ${esc(err.message)}</div>`;
  }
}
init();
</script>
</body>
</html>
