<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thống kê Apriori — Trực quan hóa Bestsellers, Combos &amp; Luật Gợi ý · BasketIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
:root{--bg:#f8fafc;--surface:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.55;padding-bottom:6vh;font-size:clamp(15px,.95vw,18px)}
button{font:inherit;color:inherit}
main{width:100%;max-width:none;margin:0;padding:2vh 2.5vw}

.page-head{background:var(--surface);border-bottom:1px solid var(--border);padding:2.2vh 2.5vw}
.page-head h1{font-size:clamp(1.5rem,1.8vw,2.2rem);font-weight:800;letter-spacing:-.025em}
.page-head p{color:var(--text-muted);font-size:clamp(.92rem,.96vw,1.12rem);margin-top:.5vh;max-width:95ch}

/* ---------- KPI Strip ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1vw;margin-bottom:2.2vh}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:1.5vh 1.2vw;
  box-shadow:var(--shadow-sm);
  display:flex;
  flex-direction:column;
  gap:2px;
}
.kpi-top{display:flex;justify-content:space-between;align-items:center}
.kpi-ico{font-size:clamp(1.1rem,1.2vw,1.4rem)}
.kpi-tag{font-family:var(--mono);font-size:clamp(.72rem,.74vw,.86rem);font-weight:700;padding:2px 8px;border-radius:999px;background:var(--primary-light);color:var(--primary-dark)}
.kpi .v{font-size:clamp(1.45rem,1.65vw,2.05rem);font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}
.kpi .l{font-size:clamp(.8rem,.82vw,.96rem);color:var(--text-muted);font-weight:600}

/* ---------- Interactive Section Switcher ---------- */
.view-nav{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:.8vh .8vw;
  margin-bottom:2.2vh;
  box-shadow:var(--shadow-sm);
}
.view-btn{
  border:none;
  background:transparent;
  padding:1vh 1.2vw;
  border-radius:10px;
  font-size:clamp(.88rem,.92vw,1.08rem);
  font-weight:700;
  color:var(--text-muted);
  cursor:pointer;
  transition:all .15s;
  display:inline-flex;
  align-items:center;
  gap:8px;
}
.view-btn:hover{color:var(--text);background:var(--surface-sub)}
.view-btn.active{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.22)}

.stat-sec{display:none;animation:fadeIn .18s ease}
.stat-sec.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.sec-head{margin-bottom:1.8vh}
.sec-title{font-size:clamp(1.22rem,1.38vw,1.65rem);font-weight:800;letter-spacing:-.015em;margin-bottom:4px}
.sec-sub{color:var(--text-muted);font-size:clamp(.9rem,.94vw,1.08rem);max-width:95ch}

.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:1.5vw;align-items:start}
.grid2-eq{display:grid;grid-template-columns:1fr 1fr;gap:1.5vw;align-items:start}
@media (max-width:1050px){.grid2,.grid2-eq{grid-template-columns:1fr}}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:2vh 1.5vw;
  box-shadow:var(--shadow-sm);
  min-width:0;
}
.panel h3{font-size:clamp(1.04rem,1.12vw,1.32rem);font-weight:800;margin-bottom:4px}
.panel-sub{font-size:clamp(.84rem,.86vw,1rem);color:var(--text-muted);margin-bottom:1.6vh}

/* ---------- Tab 1: Pruning Funnel & Pipeline ---------- */
.funnel-list{display:flex;flex-direction:column;gap:1.4vh}
.funnel-stage{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.3vh 1.1vw;
}
.funnel-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.funnel-name{font-weight:800;font-size:clamp(.92rem,.96vw,1.12rem);color:var(--text)}
.funnel-nums{font-family:var(--mono);font-size:clamp(.82rem,.84vw,.98rem);color:var(--primary-dark);font-weight:700}
.funnel-track{
  background:#e2e8f0;
  height:20px;
  border-radius:999px;
  overflow:hidden;
  position:relative;
  display:flex;
}
.funnel-bar-kept{
  background:linear-gradient(90deg,#4f46e5,#6366f1);
  height:100%;
  border-radius:999px;
  transition:width .4s ease;
}
.funnel-note{
  font-size:clamp(.8rem,.82vw,.96rem);
  color:var(--text-muted);
  margin-top:6px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:6px;
}
.prune-badge{
  background:#fef3c7;
  color:#92400e;
  border:1px solid #fde68a;
  font-family:var(--mono);
  font-size:clamp(.74rem,.76vw,.88rem);
  font-weight:700;
  padding:1px 8px;
  border-radius:6px;
}

.pipe-steps{display:flex;flex-direction:column;gap:1.2vh}
.pipe-card{
  background:#f8fafc;
  border:1px solid var(--border);
  border-left:4px solid var(--primary);
  border-radius:12px;
  padding:1.3vh 1.1vw;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.pipe-top{display:flex;justify-content:space-between;align-items:center}
.pipe-step{font-family:var(--mono);font-size:clamp(.74rem,.76vw,.88rem);font-weight:800;background:var(--primary);color:#fff;padding:2px 9px;border-radius:6px}
.pipe-stat{font-family:var(--mono);font-size:clamp(.78rem,.8vw,.94rem);color:var(--primary-dark);font-weight:700}
.pipe-card h4{font-size:clamp(.95rem,.98vw,1.14rem);font-weight:800}
.pipe-card p{font-size:clamp(.84rem,.86vw,1rem);color:var(--text-muted)}

/* ---------- Tab 2: L1 Bestsellers & 169-Item Pareto ---------- */
.bars{display:flex;flex-direction:column;gap:.95vh}
.bar-row{
  display:grid;
  grid-template-columns:28px minmax(145px,11vw) 1fr minmax(125px,8.5vw);
  gap:10px;
  align-items:center;
  font-size:clamp(.86rem,.88vw,1.04rem);
}
.bar-rank{font-family:var(--mono);font-size:clamp(.78rem,.8vw,.92rem);color:var(--text-muted);font-weight:700;text-align:right}
.bar-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{background:var(--surface-sub);border-radius:8px;height:16px;overflow:hidden;position:relative}
.bar-fill{height:100%;background:linear-gradient(90deg,#4f46e5,#818cf8);border-radius:8px}
.bar-val{text-align:right;font-family:var(--mono);font-size:clamp(.8rem,.82vw,.96rem);color:var(--text)}

.pareto-bar{
  height:28px;
  border-radius:10px;
  overflow:hidden;
  display:flex;
  margin:1.2vh 0 1.8vh;
  border:1px solid var(--border);
}
.pareto-seg{height:100%;display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:.78rem;font-weight:800}
.tier-cards{display:flex;flex-direction:column;gap:1.1vh}
.tier-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.2vh 1vw;
  background:#f8fafc;
}
.tier-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:clamp(.9rem,.92vw,1.08rem);margin-bottom:4px}
.tier-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px}
.tier-desc{font-size:clamp(.82rem,.84vw,.98rem);color:var(--text-muted)}
.tier-samples{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.item-tag{
  display:inline-block;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  padding:2px 8px;
  font-family:var(--mono);
  font-size:clamp(.78rem,.8vw,.92rem);
  font-weight:600;
}

/* ---------- Tab 3: L2 Actual vs Random Visual Bars ---------- */
.combo-list{display:flex;flex-direction:column;gap:1.2vh}
.combo-card{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.2vh 1.1vw;
}
.combo-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.combo-pair{font-weight:800;font-size:clamp(.92rem,.95vw,1.1rem)}
.lift-pill{
  background:#ecfdf5;
  color:#047857;
  border:1px solid #a7f3d0;
  font-family:var(--mono);
  font-size:clamp(.78rem,.8vw,.94rem);
  font-weight:800;
  padding:2px 9px;
  border-radius:999px;
}
.dual-bars{display:flex;flex-direction:column;gap:5px}
.dual-row{display:grid;grid-template-columns:125px 1fr 95px;gap:8px;align-items:center;font-size:clamp(.78rem,.8vw,.92rem)}
.dual-lbl{color:var(--text-muted);font-weight:600}
.dual-track{background:#e2e8f0;height:12px;border-radius:6px;overflow:hidden}
.dual-fill-actual{height:100%;background:#4f46e5;border-radius:6px}
.dual-fill-rand{height:100%;background:#94a3b8;border-radius:6px}
.dual-num{text-align:right;font-family:var(--mono);font-weight:700}

/* ---------- Tab 4: Interactive Rule Dissector ---------- */
.dissector-layout{
  display:grid;
  grid-template-columns:clamp(310px,28vw,430px) 1fr;
  gap:1.5vw;
  align-items:start;
}
@media (max-width:1050px){.dissector-layout{grid-template-columns:1fr}}

.rule-selector-list{
  display:flex;
  flex-direction:column;
  gap:.8vh;
  max-height:640px;
  overflow-y:auto;
  padding-right:4px;
}
.rule-pick-btn{
  text-align:left;
  background:#f8fafc;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:1.1vh 1vw;
  cursor:pointer;
  transition:all .15s;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.rule-pick-btn:hover{border-color:#a5b4fc;background:#f5f3ff}
.rule-pick-btn.active{border-color:var(--primary);background:#eef2ff;box-shadow:0 4px 12px rgba(79,70,229,.12)}
.rp-top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:clamp(.88rem,.9vw,1.04rem)}
.rp-metrics{font-family:var(--mono);font-size:clamp(.76rem,.78vw,.9rem);color:var(--text-muted);display:flex;gap:10px}

.dissect-stage{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:16px;
  padding:2.2vh 1.6vw;
  display:flex;
  flex-direction:column;
  gap:2vh;
}
.dissect-banner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  padding-bottom:1.4vh;
  border-bottom:1px solid var(--border);
}
.dissect-rule-title{font-size:clamp(1.1rem,1.25vw,1.5rem);font-weight:800}
.dissect-reason{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  color:#166534;
  padding:1vh 1.1vw;
  border-radius:10px;
  font-size:clamp(.86rem,.88vw,1.04rem);
  font-weight:600;
}

.venn-and-prob{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1.4vw;
  align-items:center;
}
@media (max-width:900px){.venn-and-prob{grid-template-columns:1fr}}
.venn-box{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.2vh 1vw;
  text-align:center;
}
.prob-box{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.4vh 1.2vw;
  display:flex;
  flex-direction:column;
  gap:1.2vh;
}

.formula-cards-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1vw;
}
@media (max-width:900px){.formula-cards-3{grid-template-columns:1fr}}
.f-card{
  background:#f8fafc;
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.3vh 1vw;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.f-card-head{font-weight:800;font-size:clamp(.88rem,.9vw,1.05rem);color:var(--text)}
.f-card-eq{
  font-family:var(--mono);
  font-size:clamp(.8rem,.82vw,.95rem);
  background:#eef2ff;
  color:var(--primary-dark);
  padding:6px 9px;
  border-radius:7px;
  font-weight:700;
}
.f-card-calc{
  font-family:var(--mono);
  font-size:clamp(.92rem,.96vw,1.12rem);
  font-weight:800;
  color:#0f172a;
}
.f-card-desc{font-size:clamp(.8rem,.82vw,.95rem);color:var(--text-muted)}

.err{background:var(--danger-light);color:var(--danger);padding:16px;border-radius:10px}
</style>
</head>
<body>
<header class="app-header">
  <div class="app-header-inner">
    <a class="app-brand" href="/shop"><span class="app-logo" aria-hidden="true">🛒</span>BasketIQ</a>
    <nav class="app-nav" id="appNav" aria-label="Điều hướng chính">
      <a href="/shop">Cửa hàng</a>
      <a href="/">Demo thuật toán</a>
      <a href="/stats" class="active" aria-current="page">Thống kê Apriori</a>
      <a href="/admin">Admin</a>
    </nav>
    <button class="app-menu-toggle" type="button" aria-label="Mở menu" aria-controls="appNav" onclick="document.getElementById('appNav').classList.toggle('open')">☰</button>
  </div>
</header>

<div class="page-head">
  <h1>Thống kê Trực quan Thuật toán Apriori — Groceries POS Dataset</h1>
  <p id="srcline">Đang tải dữ liệu…</p>
</div>

<main id="root"><p class="sec-sub">Đang tải số liệu…</p></main>

<script>
const fmt = n => Number(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tags = arr => arr.map(x => `<span class="item-tag">${esc(x)}</span>`).join(' + ');

let STATS_DATA = null;
let ACTIVE_SEC = 'funnel';
let SELECTED_RULE_IDX = 0;

function render(d) {
  STATS_DATA = d;
  const o = d.overview;
  document.getElementById('srcline').innerHTML =
    `Nguồn dữ liệu chuẩn: <a href="${esc(d.url)}" target="_blank" rel="noopener"><b>${esc(d.source)}</b></a> · Thiết kế trực quan kết nối trực tiếp lý thuyết khai phá dữ liệu (Support, Confidence, Lift, Anti-monotone Pruning) với <a href="/shop"><b>Cửa hàng (/shop)</b></a>.`;

  const c2_exhaustive = (o.distinct_items * (o.distinct_items - 1)) / 2; // 14,196
  const c2_after_l1 = (o.l1_count * (o.l1_count - 1)) / 2; // 9,180
  const c3_exhaustive = (o.distinct_items * (o.distinct_items - 1) * (o.distinct_items - 2)) / 6; // 790,244

  let h = '';

  // TOP KPI STRIP
  h += `
    <div class="kpis">
      <div class="kpi">
        <div class="kpi-top"><span class="kpi-ico">🧺</span><span class="kpi-tag">Transactions (N)</span></div>
        <div class="v">${fmt(o.transactions)}</div>
        <div class="l">${fmt(o.multi_item_baskets)} giỏ mua ≥ 2 món (${o.multi_item_baskets_pct}%)</div>
      </div>
      <div class="kpi">
        <div class="kpi-top"><span class="kpi-ico">🏷️</span><span class="kpi-tag">Items (|I|)</span></div>
        <div class="v">${fmt(o.distinct_items)}</div>
        <div class="l">Trung bình ${o.avg_basket_size} món / giỏ hàng</div>
      </div>
      <div class="kpi">
        <div class="kpi-top"><span class="kpi-ico">✂️</span><span class="kpi-tag">Ngưỡng min_sup</span></div>
        <div class="v">${o.min_support_count} giỏ</div>
        <div class="l">Support ≥ ${o.min_support_pct}% trên ${fmt(o.transactions)} giỏ</div>
      </div>
      <div class="kpi">
        <div class="kpi-top"><span class="kpi-ico">🥇</span><span class="kpi-tag">Frequent L1</span></div>
        <div class="v">${fmt(o.l1_count)} / ${o.distinct_items}</div>
        <div class="l">Tỉa bỏ ${o.distinct_items - o.l1_count} mặt hàng ít phổ biến</div>
      </div>
      <div class="kpi">
        <div class="kpi-top"><span class="kpi-ico">🤝</span><span class="kpi-tag">Combos L2 &amp; L3</span></div>
        <div class="v">${fmt(o.l2_count + o.l3_count)}</div>
        <div class="l">${fmt(o.l2_count)} cặp L2 · ${fmt(o.l3_count)} bộ ba L3</div>
      </div>
      <div class="kpi">
        <div class="kpi-top"><span class="kpi-ico">⚡</span><span class="kpi-tag">Luật A ⇒ B</span></div>
        <div class="v">${fmt(o.curated_rules_count)}</div>
        <div class="l">Conf ≥ ${o.min_confidence_pct}% · Lift ≥ ${o.min_lift}×</div>
      </div>
    </div>

    <!-- INTERACTIVE NAVIGATION TABS -->
    <nav class="view-nav" aria-label="Chọn chuyên đề thống kê">
      <button class="view-btn active" type="button" data-sec="funnel">🔬 1. Phễu Cắt tỉa &amp; Quy trình Apriori</button>
      <button class="view-btn" type="button" data-sec="l1">🏆 2. Bestsellers &amp; Phân bố 169 Mặt hàng (L1)</button>
      <button class="view-btn" type="button" data-sec="combos">🤝 3. Combo Mua chung: Thực tế vs. Ngẫu nhiên (L2/L3)</button>
      <button class="view-btn" type="button" data-sec="dissector">⚡ 4. Giải phẫu Luật Gợi ý A ⇒ B (Tương tác)</button>
      <button class="view-btn" type="button" data-sec="all" style="margin-left:auto">📑 Xem toàn bộ trên 1 trang</button>
    </nav>
  `;

  // =========================================================================
  // SECTION 1: PRUNING FUNNEL & 4-STEP PIPELINE
  // =========================================================================
  h += `
    <section class="stat-sec active" id="sec-funnel">
      <div class="sec-head">
        <h2 class="sec-title">1. Phễu Cắt tỉa Không gian Tìm kiếm (Search Space Pruning) &amp; Quy trình Apriori</h2>
        <p class="sec-sub">Tại sao không thể đếm vét cạn (Brute-force) mọi tổ hợp sản phẩm? Biểu đồ phễu bên trái minh họa cách <b>Tiên đề Apriori (Anti-monotone Property)</b> cắt giảm hơn <b>99%</b> số tổ hợp dư thừa.</p>
      </div>
      <div class="grid2">
        <div class="panel">
          <h3>Phễu Thu hẹp Ứng viên qua từng vòng lặp (k = 1 → 2 → 3)</h3>
          <p class="panel-sub">So sánh số tổ hợp lý thuyết nếu vét cạn so với số tập phổ biến thực sự vượt ngưỡng <code>min_sup = ${o.min_support_count} giỏ (${o.min_support_pct}%)</code>.</p>
          <div class="funnel-list">
            <div class="funnel-stage">
              <div class="funnel-top">
                <span class="funnel-name">Vòng k = 1: Lọc mặt hàng đơn lẻ (C<sub>1</sub> → L<sub>1</sub>)</span>
                <span class="funnel-nums">${o.distinct_items} món → Giữ lại ${o.l1_count} món L<sub>1</sub></span>
              </div>
              <div class="funnel-track">
                <div class="funnel-bar-kept" style="width:${(o.l1_count / o.distinct_items * 100).toFixed(1)}%"></div>
              </div>
              <div class="funnel-note">
                <span>Đạt chuẩn ≥ 30 giỏ: <b>80.5% (${o.l1_count} món)</b></span>
                <span class="prune-badge">✂️ Tỉa 33 món (&lt; 30 giỏ) ngay từ vòng 1</span>
              </div>
            </div>

            <div class="funnel-stage">
              <div class="funnel-top">
                <span class="funnel-name">Vòng k = 2: Khai phá Cặp mua chung (C<sub>2</sub> → L<sub>2</sub>)</span>
                <span class="funnel-nums">${fmt(c2_exhaustive)} cặp lý thuyết → ${fmt(o.l2_count)} cặp L<sub>2</sub></span>
              </div>

      <div class="prob-box">
        <div style="font-weight:800;font-size:.95rem">Sự nhảy vọt Xác suất mua "${esc(conStr)}" (B)</div>
        <p style="font-size:.83rem;color:var(--text-muted)">So sánh xác suất tiên nghiệm <code>P(B)</code> (khách bất kỳ) và xác suất hậu nghiệm <code>P(B | A)</code> (khi biết khách đã chọn A):</p>

        <div>
          <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px">
            <span>⚪ Xác suất mua <b>${esc(conStr)}</b> tự nhiên <code>P(B)</code>:</span>
            <b style="font-family:var(--mono)">${suppBPct}% (${fmt(countB)}/${fmt(N)})</b>
          </div>
          <div class="dual-track" style="height:14px"><div class="dual-fill-rand" style="width:${priorWidth}%"></div></div>
        </div>

        <div>
          <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px">
            <span>🟣 Khi giỏ đã có <b>${esc(antStr)}</b> <code>P(B | A)</code>:</span>
            <b style="font-family:var(--mono);color:var(--primary-dark)">${r.confidence_pct}% (${fmt(countAB)}/${fmt(countA)})</b>
          </div>
          <div class="dual-track" style="height:14px"><div class="dual-fill-actual" style="width:${postWidth}%"></div></div>
        </div>

        <div style="font-size:.84rem;background:#eef2ff;color:#312e81;padding:8px 11px;border-radius:8px;font-weight:600">
          🚀 Việc xuất hiện <b>${esc(antStr)}</b> trong giỏ làm xác suất khách mua thêm <b>${esc(conStr)}</b> tăng vọt từ <b>${suppBPct}%</b> lên <b>${r.confidence_pct}%</b> (gấp <b>${r.lift} lần</b>)!
        </div>
      </div>
    </div>

    <div class="formula-cards-3">
      <div class="f-card">
        <div class="f-card-head">1. Độ phổ biến (Support)</div>
        <div class="f-card-eq">Support(A ⇒ B) = Count(A ∪ B) / N</div>
        <div class="f-card-calc">= ${fmt(countAB)} / ${fmt(N)} = ${r.support_pct}%</div>
        <div class="f-card-desc">Có <b>${fmt(countAB)} giỏ hàng thực tế</b> chứa đồng thời cả <i>${esc(antStr)}</i> và <i>${esc(conStr)}</i> (vượt ngưỡng min_sup = 30 giỏ).</div>
      </div>
      <div class="f-card">
        <div class="f-card-head">2. Độ tin cậy (Confidence)</div>
        <div class="f-card-eq">Conf(A ⇒ B) = Count(A ∪ B) / Count(A)</div>
        <div class="f-card-calc">= ${fmt(countAB)} / ${fmt(countA)} = ${r.confidence_pct}%</div>
        <div class="f-card-desc">Trong <b>${fmt(countA)} giỏ</b> có mua <i>${esc(antStr)}</i>, có đúng <b>${fmt(countAB)} giỏ (${r.confidence_pct}%)</b> mua kèm thêm <i>${esc(conStr)}</i>.</div>
      </div>
      <div class="f-card">
        <div class="f-card-head">3. Độ nâng tương quan (Lift)</div>
        <div class="f-card-eq">Lift(A ⇒ B) = Conf(A ⇒ B) / Sup(B)</div>
        <div class="f-card-calc">= ${r.confidence_pct}% / ${suppBPct}% = ${r.lift}×</div>
        <div class="f-card-desc">Vì <code>Lift = ${r.lift}× &gt; 1</code>, khẳng định mối liên hệ đồng xuất hiện mang tính thúc đẩy dương (Positive Correlation), không phải ngẫu nhiên.</div>
      </div>
    </div>
  `;
}

fetch('/api/retail-stats')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(render)
  .catch(e => {
    document.getElementById('root').innerHTML = `<div class="err">Không tải được số liệu: ${esc(e.message)}</div>`;
  });
</script>
</body>
</html>
